<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Attendance</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul class="nav-links">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="add-student.html">Add Student</a></li>
                <li><a href="attendance.html" class="active">View Attendance</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Attendance Records</h1>
                <div>
                    <input type="date" id="filterDate" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
                    <button id="exportCsvBtn" class="btn btn-success" style="width: auto;">Export CSV</button>
                </div>
            </header>
            
            <div class="glass-card table-container">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Location</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="../js/dashboard.js"></script>
</body>
</html>
